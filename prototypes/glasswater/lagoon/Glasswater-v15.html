let touches=new Map(),prevMid=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);if(e.pointerType==='touch'){touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===1)stir(e);else{prevMid=null;lastPointer=null;}}else{drag={id:e.pointerId,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,moved:false};lastPointer=null;canvas.style.cursor='grabbing';}});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'){if(!touches.has(e.pointerId))return;touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size>=2){let a=[...touches.values()],m=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];if(prevMid)rotate(m[0]-prevMid[0],m[1]-prevMid[1]);prevMid=m;}else stir(e);}else if(drag?.id===e.pointerId){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>4)drag.moved=true;if(drag.moved)rotate(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;}else{canvas.style.cursor='crosshair';stir(e);}});
for(let name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{touches.delete(e.pointerId);prevMid=null;if(drag?.id===e.pointerId){if(name==='pointerup'&&!drag.moved){let p=pick(e.clientX,e.clientY);if(p){pushAt(p,4.2);strokes++;}}drag=null;}lastPointer=null;canvas.style.cursor='crosshair';});canvas.addEventListener('pointerleave',()=>{lastPointer=null;});canvas.addEventListener('contextmenu',e=>e.preventDefault());document.querySelector('#reset').onclick=()=>{yaw=0;pitch=0;lastPointer=null;};
if(matchMedia('(pointer:coarse)').matches)document.querySelector('#hint').textContent='One finger: water · Two fingers: orbit';
let last=performance.now(),start=last,count=0,slow=0;
function render(now){pollGpu();let dt=clamp((now-last)/1000,0,.08);last=now;time+=dt;gesture[2]*=Math.exp(-dt*5);waveClock+=dt*(.80+.20*optics.wind);sim.advance(dt);far.advance(dt);updateFloats(dt);updateObstacles();let pr=projection(),c=cam(),s=Math.min(devicePixelRatio,1.25,1800/Math.max(pr.r.width,pr.r.height))*quality,w=Math.max(1,Math.round(pr.r.width*s)),h=Math.max(1,Math.round(pr.r.height*s));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,sim.W,sim.H,gl.RGBA,gl.UNSIGNED_BYTE,sim.encode());gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,farTex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,far.W,far.H,gl.RGBA,gl.UNSIGNED_BYTE,far.encode());updateFoam(dt,c,pr);updateCaustics(dt,c,pr);let sceneTiming=timerStart('scene');gl.viewport(0,0,w,h);gl.disable(gl.DEPTH_TEST);uniforms(sp,c,pr);draw(quad);gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);uniforms(wp,c,pr);draw(ocean);uniforms(bp,c,pr);for(let i=0;i<4;i++){gl.uniform1i(gl.getUniformLocation(bp,'ballIndex'),i);draw(sphere);}drawFlare(c,pr);timerEnd(sceneTiming);count++;if(now-start>=1000){let fps=count*1000/(now-start);frameMs=1000/fps;document.querySelector('#fps').textContent=`${Math.round(fps)} FPS · ${w} × ${h}${gpuSceneMs===null?'':' · GPU scene '+gpuSceneMs.toFixed(1)+' ms'}${gpuCausticsMs===null?'':' · caustics '+gpuCausticsMs.toFixed(1)+' ms'}`;if(fps<30){if(++slow>=2){quality=Math.max(.55,quality-.15);slow=0;}}else slow=0;start=now;count=0;}requestAnimationFrame(render);}
window.artKitPick=pick;window.artKitState=()=>({yaw,pitch,strokes,lastHit,frameMs,quality,hour,exposure,causticUpdates,gpuCausticsMs,gpuSceneMs,optics:{...optics},waveClock,lighting:lighting(),...sim.stats(),far:far.stats(),floats:floats.map(({x,y,z})=>[x,y,z]),error:gl.getError()});window.artKitProject=(x,z)=>{let {r,asp,scale}=projection(),{eye,fw,rt,up}=cam(),d=[x-eye[0],-eye[1],z-eye[2]],zz=dot(d,fw);return[r.left+r.width*(.5+dot(d,rt)*1.65/(asp*scale*zz)*.5),r.top+r.height*(.5-(dot(d,up)*1.65/(scale*zz)-.13)*.5)];};requestAnimationFrame(render);
}catch(e){document.querySelector('#err').textContent=e.message;console.error(e);}
</script></body></html>
