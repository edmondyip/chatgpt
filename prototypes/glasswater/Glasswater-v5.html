function makeWater(W,H,X,Z,c,r,cap){

vec3 sky(vec3 d){float y=max(0.,d.y),sd=max(0.,dot(d,SUN));vec3 col=mix(vec3(.72,.44,.22),vec3(.045,.18,.42),pow(y,.45));col+=vec3(.47,.20,.065)*pow(sd,10.)*(1.-.7*y);float cloud=0.;if(d.y>.015){vec2 q=d.xz/(d.y+.15);float f=fbm(q*2.5+vec2(t*.014,0.));cloud=smoothstep(.56,.77,f)*smoothstep(.015,.09,y)*exp(-y*.8);col=mix(col,mix(vec3(.18,.27,.39),vec3(.86,.48,.24),pow(sd,4.)),cloud*.58);}col+=vec3(25.,17.,8.)*smoothstep(.99965,.99992,sd)+vec3(1.5,.68,.20)*pow(sd,120.);return col;}

const skyV=`#version 300 es
in vec2 pos;out vec2 uv;void main(){uv=pos;gl_Position=vec4(pos,0.,1.);}`;
const skyF=`#version 300 es
`+glsl+`in vec2 uv;out vec4 O;void main(){vec3 d=normalize(fw*1.65+rt*uv.x*asp*scale+up*(uv.y+.13)*scale);O=vec4(tone(sky(d)),1.);}`;
const seaV=`#version 300 es
`+glsl+`in vec2 pos;out vec3 p;void main(){p=vec3(pos.x,heightAt(pos),pos.y);vec3 d=p-eye;float z=dot(d,fw);gl_Position=vec4(dot(d,rt)*1.65/(asp*scale),dot(d,up)*1.65/scale-.13*z,1.0002*z-.20,z);}`;
const ballCommon=`
float sphereHit(vec3 ro,vec3 rd,vec4 ball){vec3 oc=ro-ball.xyz;float b=dot(oc,rd),c=dot(oc,oc)-ball.w*ball.w,h=b*b-c;if(h<0.)return -1.;float q=-b-sqrt(h);return q>.006?q:-1.;}

function program(v,f){let p=gl.createProgram();for(let [type,src] of [[gl.VERTEX_SHADER,v],[gl.FRAGMENT_SHADER,f]]){let sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh);}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;}

canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'){if(!touches.has(e.pointerId))return;touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size>=2){let a=[...touches.values()],m=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2];if(prevMid)rotate(m[0]-prevMid[0],m[1]-prevMid[1]);prevMid=m;}else stir(e);}else if(drag?.id===e.pointerId){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>4)drag.moved=true;if(drag.moved)rotate(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;}else{canvas.style.cursor='crosshair';stir(e);}});
for(let name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{touches.delete(e.pointerId);prevMid=null;if(drag?.id===e.pointerId){if(name==='pointerup'&&!drag.moved){let p=pick(e.clientX,e.clientY);if(p){pushAt(p,4.2);strokes++;}}drag=null;}lastPointer=null;canvas.style.cursor='crosshair';});canvas.addEventListener('pointerleave',()=>{lastPointer=null;});canvas.addEventListener('contextmenu',e=>e.preventDefault());document.querySelector('#reset').onclick=()=>{yaw=0;pitch=0;lastPointer=null;};
if(matchMedia('(pointer:coarse)').matches)document.querySelector('#hint').textContent='One finger: water · Two fingers: orbit';
let last=performance.now(),start=last,count=0,slow=0;
function render(now){let dt=clamp((now-last)/1000,0,.08);last=now;time+=dt;sim.advance(dt);far.advance(dt);updateFloats(dt);let pr=projection(),c=cam(),s=Math.min(devicePixelRatio,1.25,1200/Math.max(pr.r.width,pr.r.height))*quality,w=Math.max(1,Math.round(pr.r.width*s)),h=Math.max(1,Math.round(pr.r.height*s));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,sim.W,sim.H,gl.RGBA,gl.UNSIGNED_BYTE,sim.encode());gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,farTex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,far.W,far.H,gl.RGBA,gl.UNSIGNED_BYTE,far.encode());gl.disable(gl.DEPTH_TEST);uniforms(sp,c,pr);draw(quad);gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);uniforms(wp,c,pr);draw(ocean);uniforms(bp,c,pr);for(let i=0;i<4;i++){gl.uniform1i(gl.getUniformLocation(bp,'ballIndex'),i);draw(sphere);}count++;if(now-start>=1000){let fps=count*1000/(now-start);frameMs=1000/fps;document.querySelector('#fps').textContent=`${Math.round(fps)} FPS · ${w} × ${h}`;if(fps<30){if(++slow>=2){quality=Math.max(.55,quality-.15);slow=0;}}else slow=0;start=now;count=0;}requestAnimationFrame(render);}
window.artKitPick=pick;window.artKitState=()=>({yaw,pitch,strokes,lastHit,frameMs,quality,...sim.stats(),far:far.stats(),floats:floats.map(({x,y,z})=>[x,y,z]),error:gl.getError()});window.artKitProject=(x,z)=>{let {r,asp,scale}=projection(),{eye,fw,rt,up}=cam(),d=[x-eye[0],-eye[1],z-eye[2]],zz=dot(d,fw);return[r.left+r.width*(.5+dot(d,rt)*1.65/(asp*scale*zz)*.5),r.top+r.height*(.5-(dot(d,up)*1.65/(scale*zz)-.13)*.5)];};requestAnimationFrame(render);
}catch(e){document.querySelector('#err').textContent=e.message;console.error(e);}
